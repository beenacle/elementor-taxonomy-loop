name: Bug report
description: Something in the Taxonomy Loop widget doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security issues here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the Taxonomy Loop widget to a page
        2. Set Post Type to …, Taxonomy to …
        3. …
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: WordPress / Elementor / Elementor Pro / PHP versions
      placeholder: "WP 7.0.2, Elementor 4.2.2, Elementor Pro 4.2.2, PHP 8.3"
    validations:
      required: true

  - type: dropdown
    id: optimized-markup
    attributes:
      label: Is Elementor's "Optimized Markup" experiment active?
      description: Elementor → Settings → Features. It changes the widget's DOM, so it matters for styling reports.
      options:
        - "Active"
        - "Inactive"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Caching plugin, custom CSS against the widget, console or PHP errors.
