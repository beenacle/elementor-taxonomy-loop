name: Feature request
description: Suggest a control or capability for the Taxonomy Loop widget.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build
      description: Describe the layout or behaviour you're after, not just the setting you want added.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you doing it today
      description: Custom CSS, a filter, several stacked Loop Grids, or nothing yet.

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
